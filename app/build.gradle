plugins {
    id "com.android.application"
}

android {
    namespace "com.daicg.hearingaid"
    compileSdk 35

    defaultConfig {
        applicationId "com.daicg.hearingaid"
        minSdk 26
        targetSdk 35
        versionCode 76
        versionName "adaptive-audio-2.0-test1"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
