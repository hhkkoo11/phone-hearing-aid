plugins {
    id "com.android.application"
}

android {
    namespace "com.daicg.hearingaid"
    compileSdk 35

    defaultConfig {
        applicationId "com.daicg.hearingaid"
        minSdk 26
        targetSdk 35
        versionCode 73
        versionName "wired-stable-1.6-test"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
